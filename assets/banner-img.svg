<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8fafc"/>
  
  <!-- Main Dashboard Container -->
  <rect x="50" y="50" width="500" height="300" rx="12" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="50" y="50" width="500" height="60" rx="12" fill="#1f2937"/>
  <rect x="50" y="98" width="500" height="2" fill="#e5e7eb"/>
  
  <!-- Header Elements -->
  <circle cx="80" cy="80" r="8" fill="#ef4444"/>
  <circle cx="100" cy="80" r="8" fill="#f59e0b"/>
  <circle cx="120" cy="80" r="8" fill="#10b981"/>
  
  <!-- Navigation -->
  <rect x="160" y="72" width="60" height="16" rx="2" fill="#6b7280"/>
  <rect x="230" y="72" width="60" height="16" rx="2" fill="#6b7280"/>
  <rect x="300" y="72" width="60" height="16" rx="2" fill="#6b7280"/>
  
  <!-- User Avatar -->
  <circle cx="520" cy="80" r="16" fill="#2563eb"/>
  
  <!-- Sidebar -->
  <rect x="70" y="130" width="120" height="200" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  
  <!-- Sidebar Items -->
  <rect x="80" y="145" width="100" height="12" rx="2" fill="#2563eb" opacity="0.8"/>
  <rect x="80" y="165" width="80" height="12" rx="2" fill="#6b7280" opacity="0.6"/>
  <rect x="80" y="185" width="90" height="12" rx="2" fill="#6b7280" opacity="0.6"/>
  <rect x="80" y="205" width="70" height="12" rx="2" fill="#6b7280" opacity="0.6"/>
  
  <!-- Main Content Area -->
  <rect x="210" y="130" width="320" height="200" rx="6" fill="#ffffff"/>
  
  <!-- Charts and Graphs -->
  <rect x="230" y="150" width="140" height="80" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
  <rect x="380" y="150" width="140" height="80" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
  
  <!-- Chart Elements -->
  <rect x="240" y="190" width="8" height="30" fill="#2563eb"/>
  <rect x="252" y="180" width="8" height="40" fill="#10b981"/>
  <rect x="264" y="185" width="8" height="35" fill="#f59e0b"/>
  <rect x="276" y="170" width="8" height="50" fill="#ef4444"/>
  <rect x="288" y="175" width="8" height="45" fill="#8b5cf6"/>
  
  <!-- Pie Chart -->
  <circle cx="450" cy="190" r="25" fill="#2563eb" opacity="0.8"/>
  <path d="M 450 165 A 25 25 0 0 1 468 201 L 450 190 Z" fill="#10b981"/>
  <path d="M 468 201 A 25 25 0 0 1 438 208 L 450 190 Z" fill="#f59e0b"/>
  
  <!-- Stats Cards -->
  <rect x="230" y="250" width="90" height="60" rx="4" fill="#f8fafc" stroke="#e5e7eb"/>
  <rect x="330" y="250" width="90" height="60" rx="4" fill="#f8fafc" stroke="#e5e7eb"/>
  <rect x="430" y="250" width="90" height="60" rx="4" fill="#f8fafc" stroke="#e5e7eb"/>
  
  <!-- Stats Numbers -->
  <text x="275" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">1.2K</text>
  <text x="275" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Tests Run</text>
  
  <text x="375" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">89%</text>
  <text x="375" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Success Rate</text>
  
  <text x="475" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">3.4K</text>
  <text x="475" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Participants</text>
  
  <!-- Floating Action Button -->
  <circle cx="520" cy="320" r="20" fill="#2563eb"/>
  <path d="M 510 320 L 530 320 M 520 310 L 520 330" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>