<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Marketing Dashboard -->
  <rect x="20" y="20" width="360" height="260" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="360" height="50" rx="8" fill="#10b981"/>
  <rect x="20" y="62" width="360" height="2" fill="#e5e7eb"/>
  
  <!-- Campaign Stats -->
  <rect x="40" y="80" width="100" height="60" rx="6" fill="#f0f9ff" stroke="#0ea5e9"/>
  <rect x="160" y="80" width="100" height="60" rx="6" fill="#f0fdf4" stroke="#10b981"/>
  <rect x="280" y="80" width="80" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  
  <!-- Conversion Funnel -->
  <polygon points="40,160 140,160 130,200 50,200" fill="#dbeafe"/>
  <polygon points="50,200 130,200 120,240 60,240" fill="#2563eb" opacity="0.7"/>
  <polygon points="60,240 120,240 110,265 70,265" fill="#1d4ed8"/>
  
  <!-- Analytics Chart -->
  <rect x="160" y="160" width="200" height="100" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  
  <!-- Line Chart -->
  <polyline points="170,220 190,200 210,210 230,180 250,190 270,170 290,160 310,180 330,170 350,150" 
            stroke="#10b981" stroke-width="3" fill="none"/>
  
  <!-- Data Points -->
  <circle cx="190" cy="200" r="3" fill="#10b981"/>
  <circle cx="230" cy="180" r="3" fill="#10b981"/>
  <circle cx="270" cy="170" r="3" fill="#10b981"/>
  <circle cx="310" cy="180" r="3" fill="#10b981"/>
  <circle cx="350" cy="150" r="3" fill="#10b981"/>
  
  <!-- KPI Numbers -->
  <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0ea5e9">2.4K</text>
  <text x="90" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Clicks</text>
  
  <text x="210" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10b981">18%</text>
  <text x="210" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">CTR</text>
  
  <text x="320" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">$4.2K</text>
  <text x="320" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Revenue</text>
</svg>