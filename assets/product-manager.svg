<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Product Management Dashboard -->
  <rect x="20" y="20" width="360" height="260" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="360" height="45" rx="8" fill="#8b5cf6"/>
  <rect x="20" y="57" width="360" height="2" fill="#e5e7eb"/>
  
  <!-- Feature Roadmap -->
  <rect x="40" y="80" width="150" height="180" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/>
  
  <!-- Roadmap Items -->
  <rect x="50" y="90" width="130" height="25" rx="4" fill="#8b5cf6" opacity="0.8"/>
  <rect x="50" y="125" width="130" height="25" rx="4" fill="#2563eb" opacity="0.6"/>
  <rect x="50" y="160" width="130" height="25" rx="4" fill="#10b981" opacity="0.6"/>
  <rect x="50" y="195" width="130" height="25" rx="4" fill="#6b7280" opacity="0.4"/>
  <rect x="50" y="230" width="130" height="25" rx="4" fill="#6b7280" opacity="0.2"/>
  
  <!-- User Feedback Panel -->
  <rect x="210" y="80" width="150" height="90" rx="6" fill="#fef9e7" stroke="#f59e0b"/>
  
  <!-- Feedback Items -->
  <circle cx="225" cy="100" r="4" fill="#10b981"/>
  <rect x="235" y="97" width="110" height="6" rx="3" fill="#6b7280" opacity="0.6"/>
  
  <circle cx="225" cy="115" r="4" fill="#ef4444"/>
  <rect x="235" y="112" width="90" height="6" rx="3" fill="#6b7280" opacity="0.6"/>
  
  <circle cx="225" cy="130" r="4" fill="#f59e0b"/>
  <rect x="235" y="127" width="100" height="6" rx="3" fill="#6b7280" opacity="0.6"/>
  
  <circle cx="225" cy="145" r="4" fill="#10b981"/>
  <rect x="235" y="142" width="85" height="6" rx="3" fill="#6b7280" opacity="0.6"/>
  
  <!-- Metrics -->
  <rect x="210" y="185" width="150" height="75" rx="6" fill="#f0fdf4" stroke="#10b981"/>
  
  <!-- Metric Cards -->
  <rect x="220" y="200" width="40" height="30" rx="3" fill="white" stroke="#e5e7eb"/>
  <rect x="270" y="200" width="40" height="30" rx="3" fill="white" stroke="#e5e7eb"/>
  <rect x="320" y="200" width="30" height="30" rx="3" fill="white" stroke="#e5e7eb"/>
  
  <!-- Metric Values -->
  <text x="240" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1f2937">4.2</text>
  <text x="240" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#6b7280">Rating</text>
  
  <text x="290" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1f2937">92%</text>
  <text x="290" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#6b7280">Adoption</text>
  
  <text x="335" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1f2937">18</text>
  <text x="335" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#6b7280">NPS</text>
  
  <!-- Progress Indicators -->
  <rect x="220" y="240" width="120" height="4" rx="2" fill="#e5e7eb"/>
  <rect x="220" y="240" width="80" height="4" rx="2" fill="#10b981"/>
  
  <rect x="220" y="250" width="120" height="4" rx="2" fill="#e5e7eb"/>
  <rect x="220" y="250" width="60" height="4" rx="2" fill="#2563eb"/>
</svg>